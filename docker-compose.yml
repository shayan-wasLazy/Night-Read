services:
  nightread:
    build: .
    container_name: nightread
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      NIGHTREAD_DATA: /data
      NIGHTREAD_DB: /appdata/nightread.db
    volumes:
      - /DATA/Media/NightRead:/data
      - /DATA/AppData/nightread/database:/appdata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s